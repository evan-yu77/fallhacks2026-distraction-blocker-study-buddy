<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Left Side Sticky Tabs -->
  <!-- Top Tab: Deep Blue -->
  <rect x="2" y="6" width="4" height="4" fill="#0d1b6e" />
  <rect x="2" y="6" width="1" height="4" fill="#1b2fa8" />
  
  <!-- Middle Tab: Rose / Pink -->
  <rect x="2" y="11" width="4" height="4" fill="#e66378" />
  <rect x="2" y="11" width="1" height="4" fill="#f8899b" />
  
  <!-- Bottom Tab: Bright Coral / Red -->
  <rect x="2" y="16" width="4" height="4" fill="#d92a3f" />
  <rect x="2" y="16" width="1" height="4" fill="#eb4d60" />

  <!-- Outer Black Outline of Head -->
  <rect x="6" y="3" width="20" height="18" fill="#1a1412" />

  <!-- Split Face Left (Teal / Jade) -->
  <rect x="7" y="4" width="9" height="16" fill="#1b9a7a" />
  <rect x="7" y="4" width="2" height="16" fill="#28b894" /> <!-- Highlight -->

  <!-- Split Face Right (Soft Sky Blue) -->
  <rect x="16" y="4" width="9" height="16" fill="#88d8e6" />
  <rect x="23" y="4" width="2" height="16" fill="#6bc2d1" /> <!-- Shadow -->

  <!-- Finder Nose Profile -->
  <rect x="15" y="12" width="2" height="4" fill="#126e57" />
  <rect x="16" y="14" width="2" height="2" fill="#126e57" />

  <!-- Top-Right Mint Stamp / Note -->
  <rect x="20" y="5" width="4" height="3" fill="#30bf8d" />
  <rect x="21" y="6" width="2" height="1" fill="#6df0c5" />

  <!-- Eyebrows / Expressions -->
  <rect x="10" y="8" width="2" height="1" fill="#0d4d3c" />
  <rect x="20" y="8" width="2" height="1" fill="#356770" />

  <!-- Left Big Sparkle Eye -->
  <rect x="9" y="10" width="5" height="5" fill="#111111" />
  <rect x="10" y="10" width="2" height="2" fill="#ffffff" />
  <rect x="12" y="12" width="1" height="1" fill="#ffffff" />
  <rect x="9" y="15" width="2" height="1" fill="#e66378" /> <!-- Blush -->

  <!-- Right Big Sparkle Eye -->
  <rect x="18" y="10" width="5" height="5" fill="#111111" />
  <rect x="19" y="10" width="2" height="2" fill="#ffffff" />
  <rect x="21" y="12" width="1" height="1" fill="#ffffff" />
  <rect x="21" y="15" width="2" height="1" fill="#e66378" /> <!-- Blush -->

  <!-- Black Collar / Base -->
  <rect x="7" y="20" width="18" height="3" fill="#161210" />

  <!-- Waving Stick Arms -->
  <g class="pixel-arms">
    <rect x="3" y="19" width="1" height="3" fill="#161210" />
    <rect x="4" y="21" width="3" height="1" fill="#161210" />
    <rect x="25" y="21" width="3" height="1" fill="#161210" />
    <rect x="28" y="19" width="1" height="3" fill="#161210" />
  </g>

  <!-- Walking Stick Legs -->
  <g class="mascot-legs">
    <rect class="leg-1" x="10" y="23" width="1" height="6" fill="#161210" />
    <rect class="leg-2" x="13" y="23" width="1" height="6" fill="#161210" />
    <rect class="leg-3" x="18" y="23" width="1" height="6" fill="#161210" />
    <rect class="leg-4" x="21" y="23" width="1" height="6" fill="#161210" />
  </g>
</svg>