<!DOCTYPE html>
<html>
<head>
  <title>Digital Side-Kick</title>
</head>
<body>
  <h2>Digital Side-Kick</h2>

  <input id="minutes" type="number" value="25" min="1">
  <button id="startBtn">Start Studying</button>

  <h1 id="timer">25:00</h1>
  <p id="leaves">Leaves collected: 0 🍃</p>

  <hr> <!-- Visual divider -->

    <!-- New Blocklist Section -->
    <div>
        <h3>Block a Website</h3>
        <input type="text" id="siteInput" placeholder="e.g., youtube.com">
        <button id="saveBtn">Add to Blocklist</button>
        <button id="pauseBtn" style="display: none;">Pause</button>
        <p id="saveStatus" style="color: green; font-size: 0.8em; display: none;">Saved!</p>
    </div>

  <script src="popup.js"></script>
</body>
</html>
