<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITE BLOCKED! - JEPPY IS MAD</title>
  <link rel="stylesheet" href="blocked.css">

  <!-- Pixel Art Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <div class="screen-flash"></div>

  <main class="alert-box">
    <!-- Top Warning Header -->
    <div class="alert-banner">
      <span class="skull-icon">⚠</span>
      <h1>BRO LOCK INNNNNN</h1>
      <span class="skull-icon">⚠</span>
    </div>

    <p class="subtitle">Jepi: "YO LOCK IN"</p>

    <!-- LARGE ANGRY PIXEL MASCOT (Flared Elbows & Crossed Arms in an "X") -->
    <svg id="angry-mascot" viewBox="0 0 32 32" shape-rendering="crispEdges">
        <!-- Pixel Anger Mark (💢) Top Left -->
        <g class="anger-mark">
          <rect x="3" y="1" width="3" height="1" fill="#ff2a3b" />
          <rect x="2" y="2" width="1" height="3" fill="#ff2a3b" />
          <rect x="5" y="2" width="1" height="3" fill="#ff2a3b" />
          <rect x="3" y="3" width="2" height="1" fill="#fff" />
        </g>

        <!-- Left Tabs -->
        <rect x="2" y="6" width="4" height="4" fill="#0d1b6e" />
        <rect x="2" y="11" width="4" height="4" fill="#e66378" />
        <rect x="2" y="16" width="4" height="4" fill="#d92a3f" />

        <!-- Outer Black Outline of Head -->
        <rect x="6" y="3" width="20" height="18" fill="#140d0b" />

        <!-- Split Face Left: Deep Angry Teal -->
        <rect x="7" y="4" width="9" height="16" fill="#157c62" />

        <!-- Split Face Right: Strained Sky Blue -->
        <rect x="16" y="4" width="9" height="16" fill="#71b8c7" />

        <!-- Finder Nose Notch -->
        <rect x="15" y="11" width="2" height="4" fill="#0e5342" />
        <rect x="16" y="13" width="2" height="2" fill="#0e5342" />

        <!-- Top-Right Mint Stamp -->
        <rect x="20" y="5" width="4" height="3" fill="#248a66" />

        <!-- Angered Red Flushed Cheeks -->
        <rect x="8" y="14" width="3" height="2" fill="#992019" />
        <rect x="21" y="14" width="3" height="2" fill="#992019" />

        <!-- ANGRY EYES: Angled Glare -->
        <!-- Left Eye (Slanted inward) -->
        <rect x="9" y="9" width="5" height="1" fill="#111" />
        <rect x="10" y="10" width="4" height="3" fill="#fff" />
        <rect x="11" y="10" width="3" height="3" fill="#111" />
        <rect x="13" y="11" width="1" height="1" fill="#ff2222" />
        
        <!-- Right Eye (Slanted inward) -->
        <rect x="18" y="9" width="5" height="1" fill="#111" />
        <rect x="18" y="10" width="4" height="3" fill="#fff" />
        <rect x="18" y="10" width="3" height="3" fill="#111" />
        <rect x="18" y="11" width="1" height="1" fill="#ff2222" />

        <!-- Angry Stern Frown -->
        <rect x="14" y="15" width="4" height="1" fill="#140d0b" />
        <rect x="13" y="16" width="1" height="1" fill="#140d0b" />
        <rect x="18" y="16" width="1" height="1" fill="#140d0b" />

        <!-- Collar / Base Line -->
        <rect x="7" y="20" width="18" height="2" fill="#140d0b" />

        <!-- ==============================================
             CROSSED ARMS IN A DISTINCT "X" SHAPE
             ============================================== -->
        <g id="crossed-arms-x">
          <!-- Flared Left Elbow -->
          <rect x="2" y="18" width="4" height="4" fill="#140d0b" />
          <rect x="3" y="19" width="2" height="2" fill="#157c62" />

          <!-- Flared Right Elbow -->
          <rect x="26" y="18" width="4" height="4" fill="#140d0b" />
          <rect x="27" y="19" width="2" height="2" fill="#71b8c7" />

          <!-- DIAGONAL 1: Arm slanting UP-RIGHT (from Left Elbow to Right Fist) [/] -->
          <!-- Black Outline -->
          <rect x="4" y="20" width="4" height="3" fill="#140d0b" />
          <rect x="7" y="19" width="4" height="3" fill="#140d0b" />
          <rect x="10" y="18" width="4" height="3" fill="#140d0b" />
          <rect x="13" y="17" width="5" height="3" fill="#140d0b" />
          <rect x="17" y="16" width="4" height="3" fill="#140d0b" />
          <rect x="20" y="15" width="4" height="4" fill="#140d0b" />

          <!-- Arm Fill (Teal) -->
          <rect x="5" y="21" width="3" height="1" fill="#157c62" />
          <rect x="8" y="20" width="3" height="1" fill="#157c62" />
          <rect x="11" y="19" width="3" height="1" fill="#157c62" />
          <rect x="14" y="18" width="3" height="1" fill="#157c62" />

          <!-- DIAGONAL 2: Arm slanting UP-LEFT (from Right Elbow to Left Fist) [\] -->
          <!-- Black Outline -->
          <rect x="24" y="20" width="4" height="3" fill="#140d0b" />
          <rect x="21" y="19" width="4" height="3" fill="#140d0b" />
          <rect x="18" y="18" width="4" height="3" fill="#140d0b" />
          <rect x="10" y="16" width="4" height="3" fill="#140d0b" />
          <rect x="7" y="15" width="4" height="4" fill="#140d0b" />

          <!-- Arm Fill (Sky Blue) -->
          <rect x="24" y="21" width="3" height="1" fill="#71b8c7" />
          <rect x="21" y="20" width="3" height="1" fill="#71b8c7" />
          <rect x="18" y="19" width="3" height="1" fill="#71b8c7" />

          <!-- Center Intersection of the "X" -->
          <rect x="14" y="17" width="4" height="3" fill="#140d0b" />
          <rect x="15" y="18" width="2" height="1" fill="#ffffff" /> <!-- Highlight at center cross -->

          <!-- Left Clenched Fist (White Glove) -->
          <rect x="8" y="16" width="3" height="2" fill="#ffffff" />
          <rect x="8" y="17" width="1" height="1" fill="#c0c0c0" />

          <!-- Right Clenched Fist (White Glove) -->
          <rect x="21" y="16" width="3" height="2" fill="#ffffff" />
          <rect x="23" y="17" width="1" height="1" fill="#c0c0c0" />
        </g>

        <!-- Stomping Stick Legs -->
        <rect x="10" y="22" width="2" height="7" fill="#140d0b" />
        <rect x="14" y="22" width="2" height="6" fill="#140d0b" />
        <rect x="18" y="22" width="2" height="6" fill="#140d0b" />
        <rect x="22" y="22" width="2" height="7" fill="#140d0b" />
        <!-- Stomp Boots/Dust -->
        <rect x="9" y="28" width="4" height="2" fill="#ff3344" />
        <rect x="21" y="28" width="4" height="2" fill="#ff3344" />
      </svg>

    <button id="closeBtn">
      <span class="btn-text">GET BACK TO GRINDING</span>
    </button>
  </main>

  <script src="blocked.js"></script>
</body>
</html>
