
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stay On Track - Autumn Haven</title>
  <link rel="stylesheet" href="content.css">
  
  <!-- Pixel Art Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       PIXEL ART RESET & AUTUMN PALETTE
       ========================================================== */
       .ground-mascot {
    position: absolute;
    bottom: 28px; /* walks right on top of the dirt line */
    left: 0;
    width: 64px;
    height: 64px;
    z-index: 6; /* Walks in front of back trees, behind the owl tree */
    image-rendering: pixelated;
    animation: 
        pixelPatrol 20s steps(120) infinite,
        pixelBob 0.3s steps(2) infinite;
    }

.ground-mascot img {
  width: 100%;
  height: 100%;
}
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    :root {
      --sky-top: #3b2d54;
      --sky-mid: #9c4f43;
      --sky-bottom: #e59b58;
      --ground-top: #3d1e13;
      --ground-dark: #200f09;
      --gold-yellow: #f4b41b;
      --amber: #e66b27;
      --rust-red: #a3281b;
      --wood-light: #442416;
      --wood-dark: #27140b;
      --ui-bg: #fff0d4;
      --ui-border: #27140b;
      --ui-shadow: #c99365;
    }

    body {
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #27140b;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 75%, #ba6336 100%);
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 50px;
    }

    /* Pixelated Scanline & Dithering Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.08) 0px,
        rgba(0, 0, 0, 0.08) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ==========================================================
       CONTAINER & RETRO UI
       ========================================================== */
    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 540px;
    }

    /* Pixel Badge Title */
    .title-badge {
      background: var(--ui-bg);
      border: 4px solid var(--ui-border);
      box-shadow: 
        6px 6px 0px rgba(0, 0, 0, 0.4),
        inset -4px -4px 0px var(--ui-shadow);
      padding: 14px 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    h1.main-title {
      font-size: 14px;
      line-height: 1.6;
      color: #7b180d;
      text-shadow: 2px 2px 0px #fce2bd;
      letter-spacing: 1px;
    }

    /* Pixel Search Box */
    form {
      width: 100%;
      margin-bottom: 28px;
    }

    .search-container {
      position: relative;
      display: flex;
      width: 100%;
    }

    input[type="text"] {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 16px 18px;
      background: #fff8ee;
      color: var(--wood-dark);
      border: 4px solid var(--wood-dark);
      outline: none;
      box-shadow: 
        5px 5px 0px rgba(0, 0, 0, 0.4),
        inset 3px 3px 0px #deb887;
    }

    input[type="text"]::placeholder {
      color: #9f7b60;
    }

    input[type="text"]:focus {
      background: #ffffff;
      box-shadow: 
        5px 5px 0px #000,
        inset 3px 3px 0px #f4b41b;
    }

    /* Retro RPG Focus Timer HUD */
    .timer-container {
      width: 100%;
      background: var(--wood-light);
      border: 4px solid var(--wood-dark);
      outline: 4px solid #f4b41b;
      box-shadow: 
        0 8px 0 0 rgba(0, 0, 0, 0.4),
        inset -4px -4px 0px #241108,
        inset 4px 4px 0px #6d3a24;
      padding: 24px 20px;
      text-align: center;
      position: relative;
    }

    .timer-container h2 {
      font-size: 12px;
      color: #ffd07d;
      margin-bottom: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000;
    }

    #timer {
      font-size: 38px;
      color: #fff4d1;
      background: #1e110a;
      border: 4px solid #63331a;
      padding: 14px 10px;
      margin-bottom: 16px;
      letter-spacing: 3px;
      text-shadow: 3px 3px 0px #c7381b;
      box-shadow: inset 3px 3px 0px #000000;
    }

    #leaves {
      font-size: 11px;
      color: #ffc478;
      text-shadow: 2px 2px 0px #000;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 14px;
      border: 2px dashed #a55a30;
    }
    /* ==========================================================
       LEAF PILE & PICKUP ANIMATION STYLES
       ========================================================== */
       /* ==========================================================
       BIGGER RETRO LEAVES & PROMINENT LEAF PILE
       ========================================================== */

    /* 1. BIGGER FALLING BACKGROUND LEAVES */
    .leaf {
      position: fixed;
      width: 22px;        /* Increased from 10px */
      height: 22px;
      pointer-events: none;
      z-index: 9;
      animation-name: fallAndDrift;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.35));
    }

    /* 2. BIGGER DROPPED GROUND LEAF (Pickup Target) */
    .ground-pickup-leaf {
      position: absolute;
      bottom: 28px;
      left: 28%;
      width: 32px;        /* Increased from 16px */
      height: 32px;
      z-index: 7;
      display: none;
      filter: drop-shadow(0 4px 0px rgba(0, 0, 0, 0.4));
    }

    .ground-pickup-leaf.active {
      display: block;
      animation: dropLeaf 0.45s steps(4) forwards;
    }

    @keyframes dropLeaf {
      0%   { transform: translateY(-60px) rotate(-90deg) scale(0.5); opacity: 0; }
      100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    }

    /* 3. BIGGER HELD LEAF (Carried Above Mascot) */
    .held-leaf {
      position: absolute;
      top: -24px;         /* Raised above his head */
      left: 16px;
      width: 32px;        /* Increased from 18px */
      height: 32px;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      filter: drop-shadow(0 2px 0px #000);
      transition: opacity 0.1s;
    }

    .ground-mascot.has-leaf .held-leaf {
      opacity: 1;
      animation: leafWiggle 0.3s steps(2) infinite;
    }

    @keyframes leafWiggle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-4px) rotate(6deg); }
    }

    /* 4. LARGE, ALWAYS-VISIBLE LEAF PILE */
    .leaf-pile {
      position: absolute;
      bottom: 24px;
      right: 18%;
      width: 120px;       /* Increased from 52px (more than double!) */
      height: 72px;        /* Increased from 32px */
      z-index: 6;
      filter: drop-shadow(0 6px 0px rgba(0, 0, 0, 0.4));
      transform-origin: bottom center;
    }

    .leaf-pile.bounce {
      animation: pileBounce 0.45s steps(4) 1;
    }

    @keyframes pileBounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.3) translateY(-10px); }
      100% { transform: scale(1); }
    }

    /* Staging: Base layer is ALWAYS visible so you can see where the pile is! */
    .leaf-pile .lvl-base { display: block; }
    .leaf-pile .lvl { display: none; }
    
    .leaf-pile.stage-1 .lvl-1 { display: block; }
    .leaf-pile.stage-2 .lvl-1, .leaf-pile.stage-2 .lvl-2 { display: block; }
    .leaf-pile.stage-3 .lvl-1, .leaf-pile.stage-3 .lvl-2, .leaf-pile.stage-3 .lvl-3 { display: block; }
    .leaf-pile.stage-4 .lvl-1, .leaf-pile.stage-4 .lvl-2, .leaf-pile.stage-4 .lvl-3, .leaf-pile.stage-4 .lvl-4 { display: block; }
    .leaf-pile.stage-5 .lvl { display: block; }

    /* Mascot Gathering Run Adjusted for the Bigger Pile */
    .ground-mascot.gathering {
      animation: gatherRun 3.4s steps(80) forwards !important;
    }

    @keyframes gatherRun {
      0% {
        left: 10%;
        transform: scaleX(1);
      }
      25% {
        left: 26%;
        transform: scaleX(1);
      }
      35% {
        left: 26%;
        transform: scaleX(1) translateY(4px); /* Scooping down */
      }
      40% {
        left: 26%;
        transform: scaleX(1) translateY(0);
      }
      45% {
        left: 30%;
        transform: scaleX(1);
      }
      75% {
        left: calc(100vw - 18% - 130px); /* Runs right up to the bigger pile */
        transform: scaleX(1);
      }
      82% {
        left: calc(100vw - 18% - 130px);
        transform: scaleX(1) translateY(-22px); /* High victory toss jump */
      }
      90% {
        left: calc(100vw - 18% - 130px);
        transform: scaleX(1) translateY(0);
      }
      100% {
        left: calc(100vw - 18% - 130px);
        transform: scaleX(-1);
      }
    }

    /* Floating "+1 LEAF" Pop Text */
    .leaf-popup-text {
      position: absolute;
      bottom: 105px;
      right: 19%;
      color: #ffd043;
      font-size: 12px;
      text-shadow: 2px 2px 0px #000;
      z-index: 20;
      pointer-events: none;
      animation: floatBadge 1.4s ease-out forwards;
    }
    

    /* ==========================================================
       PIXEL TREES & WIND SWAY ANIMATION
       ========================================================== */
    .forest-layer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }


    /* Pixel Ground */
    .pixel-ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: var(--ground-top);
      border-top: 6px solid #63331a;
      box-shadow: inset 0 -16px 0 0 var(--ground-dark);
      z-index: 6;
    }

    .pixel-grass-clumps {
      position: absolute;
      top: -12px;
      left: 0;
      width: 100%;
      height: 6px;
      background-image: 
        radial-gradient(#d37424 50%, transparent 50%),
        radial-gradient(#7c3614 50%, transparent 50%);
      background-size: 24px 12px;
      background-position: 0 0, 12px 6px;
    }

    /* Trees Setup */
    .tree {
      position: absolute;
      bottom: 40px;
      transform-origin: bottom center;
    }

    /* Sway Animations (Different speeds for realistic depth) */
    @keyframes windSwayLeft {
      0%, 100% {
        transform: rotate(0deg) skewX(0deg);
      }
      35% {
        transform: rotate(-3deg) skewX(-2deg);
      }
      70% {
        transform: rotate(1.5deg) skewX(1deg);
      }
    }

    @keyframes windSwayRight {
      0%, 100% {
        transform: rotate(0deg) skewX(0deg);
      }
      30% {
        transform: rotate(3.5deg) skewX(2.5deg);
      }
      75% {
        transform: rotate(-2deg) skewX(-1.5deg);
      }
    }

    @keyframes windSwayBack {
      0%, 100% {
        transform: rotate(0deg) skewX(0deg);
      }
      40% {
        transform: rotate(2deg) skewX(1deg);
      }
      80% {
        transform: rotate(-1.5deg) skewX(-1deg);
      }
    }

    /* Tree Placements */
    .tree-left {
      left: -20px;
      width: 240px;
      height: 380px;
      animation: windSwayLeft 5.5s ease-in-out infinite;
      z-index: 7;
    }

    .tree-right {
      right: -30px;
      width: 260px;
      height: 410px;
      animation: windSwayRight 6.5s ease-in-out infinite;
      z-index: 7;
    }

    .tree-back-left {
      left: 18%;
      bottom: 44px;
      width: 150px;
      height: 250px;
      opacity: 0.65;
      animation: windSwayBack 7s ease-in-out infinite 0.5s;
      z-index: 3;
      filter: brightness(0.7) saturate(0.85);
    }

    .tree-back-right {
      right: 17%;
      bottom: 44px;
      width: 170px;
      height: 270px;
      opacity: 0.65;
      animation: windSwayBack 8s ease-in-out infinite 1.2s;
      z-index: 3;
      filter: brightness(0.7) saturate(0.85);
    }

    /* Jeppy the Pixel Owl in the Tree */
    .jeppy-owl {
      position: absolute;
      top: 150px;
      right: 55px;
      width: 24px;
      height: 24px;
      z-index: 8;
    }

    .jeppy-eyes {
      animation: blink 4s infinite;
    }

    @keyframes blink {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    /* ==========================================================
       FALLING PIXEL LEAVES
       ========================================================== */
    .leaf {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 9;
      animation-name: fallAndDrift;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes fallAndDrift {
      0% {
        transform: translate(0, -20px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      50% {
        transform: translate(80px, 50vh) rotate(180deg);
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translate(160px, 105vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Leaf variations */
    .leaf-1 { left: 5%;  animation-duration: 9s; animation-delay: 0s; }
    .leaf-2 { left: 22%; animation-duration: 7s; animation-delay: 2s; }
    .leaf-3 { left: 45%; animation-duration: 11s; animation-delay: 1s; }
    .leaf-4 { left: 68%; animation-duration: 8.5s; animation-delay: 3.5s; }
    .leaf-5 { left: 88%; animation-duration: 6.5s; animation-delay: 0.5s; }
    .leaf-6 { left: 35%; animation-duration: 10s; animation-delay: 5s; }

    /* Responsive adjustments */
    @media (max-width: 820px) {
      .tree-left { width: 160px; height: 260px; left: -30px; }
      .tree-right { width: 170px; height: 280px; right: -30px; }
      .tree-back-left, .tree-back-right { display: none; }
      #timer { font-size: 28px; }
      h1.main-title { font-size: 11px; }
    }
  </style>
</head>

        <div class="leaf-pile stage-0" id="leafPile">
          <svg viewBox="0 0 48 30" width="100%" height="100%" shape-rendering="crispEdges">

            <g class="lvl-base">
              <rect x="2" y="27" width="44" height="3" fill="#200f09" />
              <rect x="6" y="25" width="14" height="3" fill="#6d1910" />
              <rect x="22" y="25" width="18" height="3" fill="#872910" />

            <g class="lvl lvl-1">
              <rect x="4" y="22" width="16" height="4" fill="#a3281b" />

              <rect x="12" y="10" width="22" height="5" fill="#e66b27" />

              <rect x="8" y="8" width="28" height="5" fill="#f49d23" />

        <!-- Ground Floor Dirt Layer -->
        <div class="pixel-ground">
