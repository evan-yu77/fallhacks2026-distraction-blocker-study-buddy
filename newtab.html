<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stay On Track - Autumn Haven & Zen Break</title>
  <link rel="stylesheet" href="content.css">
  
  <!-- Pixel Art Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       PIXEL ART RESET & COLOR PALETTES
       ========================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    :root {
      /* Autumn Haven Palette */
      --sky-top: #3b2d54;
      --sky-mid: #9c4f43;
      --sky-bottom: #e59b58;
      --ground-top: #3d1e13;
      --ground-dark: #200f09;
      --gold-yellow: #f4b41b;
      --amber: #e66b27;
      --rust-red: #a3281b;
      --wood-light: #442416;
      --wood-dark: #27140b;
      --ui-bg: #fff0d4;
      --ui-border: #27140b;
      --ui-shadow: #c99365;

      /* Zen Garden Break Palette */
      --zen-sky-top: #2c443b;
      --zen-sky-mid: #688a75;
      --zen-sky-bottom: #cbe3d3;
      --zen-sand: #eae5d8;
      --zen-sand-shade: #c2baa8;
      --zen-vermilion: #d9381e;
      --zen-matcha: #436b36;
      --zen-sakura: #ff8fb1;
    }

    body {
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #27140b;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 75%, #ba6336 100%);
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 45px;
      transition: background 1.2s ease;
    }

    /* Screen Scanlines */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.08) 0px,
        rgba(0, 0, 0, 0.08) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ==========================================================
       ZEN BREAK MODE TRANSITIONS
       ========================================================== */
    body.is-break {
      background: linear-gradient(180deg, var(--zen-sky-top) 0%, var(--zen-sky-mid) 40%, var(--zen-sky-bottom) 75%, #d5e5db 100%);
    }

    body.is-break .forest-layer,
    body.is-break .autumn-leaf {
      display: none !important;
    }

    body.is-break .zen-garden-layer,
    body.is-break .sakura-petal {
      display: block !important;
    }

    body.is-break .title-badge {
      background: #eef7f0;
      border-color: #1e3328;
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.4), inset -4px -4px 0px #a4c2b0;
    }

    body.is-break h1.main-title {
      color: #1c5236;
      text-shadow: 2px 2px 0px #d4ebd9;
    }

    body.is-break .timer-container {
      background: #24382c;
      border-color: #15241b;
      outline-color: var(--zen-vermilion);
      box-shadow: 0 8px 0 0 rgba(0, 0, 0, 0.4), inset -4px -4px 0px #111c15, inset 4px 4px 0px #3d5e4b;
    }

    body.is-break .timer-container h2 {
      color: #bbf0cf;
    }

    body.is-break #timer {
      color: #ffffff;
      background: #0e1712;
      border-color: #2e4d3b;
      text-shadow: 3px 3px 0px var(--zen-vermilion);
    }

    /* ==========================================================
       CONTAINER & RETRO UI
       ========================================================== */
    .content-wrapper {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 540px;
    }

    .title-badge {
      background: var(--ui-bg);
      border: 4px solid var(--ui-border);
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.4), inset -4px -4px 0px var(--ui-shadow);
      padding: 14px 20px;
      margin-bottom: 22px;
      text-align: center;
      transition: all 0.5s ease;
    }

    h1.main-title {
      font-size: 13px;
      line-height: 1.6;
      color: #7b180d;
      text-shadow: 2px 2px 0px #fce2bd;
      letter-spacing: 1px;
    }

    form {
      width: 100%;
      margin-bottom: 24px;
    }

    .search-container {
      position: relative;
      display: flex;
      width: 100%;
    }

    input[type="text"] {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 16px 18px;
      background: #fff8ee;
      color: var(--wood-dark);
      border: 4px solid var(--wood-dark);
      outline: none;
      box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.4), inset 3px 3px 0px #deb887;
    }

    input[type="text"]:focus {
      background: #ffffff;
      box-shadow: 5px 5px 0px #000, inset 3px 3px 0px #f4b41b;
    }

    /* Focus HUD */
    .timer-container {
      width: 100%;
      background: var(--wood-light);
      border: 4px solid var(--wood-dark);
      outline: 4px solid #f4b41b;
      box-shadow: 0 8px 0 0 rgba(0, 0, 0, 0.4), inset -4px -4px 0px #241108, inset 4px 4px 0px #6d3a24;
      padding: 22px 20px;
      text-align: center;
      position: relative;
    }

    .timer-container h2 {
      font-size: 11px;
      color: #ffd07d;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000;
    }

    #timer {
      font-size: 38px;
      color: #fff4d1;
      background: #1e110a;
      border: 4px solid #63331a;
      padding: 12px 10px;
      margin-bottom: 14px;
      letter-spacing: 3px;
      text-shadow: 3px 3px 0px #c7381b;
      box-shadow: inset 3px 3px 0px #000000;
    }

    #leaves {
      font-size: 10px;
      color: #ffc478;
      text-shadow: 2px 2px 0px #000;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 14px;
      border: 2px dashed #a55a30;
    }

    /* Skip/Start Study Button */
    #endBreakBtn {
      display: none;
      margin-top: 14px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 12px 16px;
      color: #fff;
      background: var(--zen-vermilion);
      border: 3px solid #1a0e08;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }
    #endBreakBtn:hover {
      background: #eb4d34;
    }
    body.is-break #endBreakBtn {
      display: inline-block;
    }

    /* ==========================================================
       AUTUMN SCENERY (ACTIVE DURING STUDY)
       ========================================================== */
    .forest-layer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .ground-mascot {
      position: absolute;
      bottom: 28px;
      left: 0;
      width: 64px;
      height: 64px;
      z-index: 6;
      image-rendering: pixelated;
      animation: pixelPatrol 20s steps(120) infinite, pixelBob 0.3s steps(2) infinite;
    }
    .ground-mascot img { width: 100%; height: 100%; }

    @keyframes pixelPatrol {
      0% { transform: translateX(10px) scaleX(1); }
      48% { transform: translateX(calc(100vw - 110px)) scaleX(1); }
      50% { transform: translateX(calc(100vw - 110px)) scaleX(-1); }
      98% { transform: translateX(10px) scaleX(-1); }
      100% { transform: translateX(10px) scaleX(1); }
    }
    @keyframes pixelBob {
      0%, 100% { margin-bottom: 0px; }
      50% { margin-bottom: 5px; }
    }

    /* Leaf Pile & Mascot Animation */
    .leaf-pile {
      position: absolute;
      bottom: 24px;
      right: 18%;
      width: 120px;
      height: 72px;
      z-index: 6;
      filter: drop-shadow(0 6px 0px rgba(0, 0, 0, 0.4));
      transform-origin: bottom center;
    }
    .leaf-pile.bounce { animation: pileBounce 0.45s steps(4) 1; }
    @keyframes pileBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.3) translateY(-10px); }
      100% { transform: scale(1); }
    }
    .leaf-pile .lvl-base { display: block; }
    .leaf-pile .lvl { display: none; }
    .leaf-pile.stage-1 .lvl-1 { display: block; }
    .leaf-pile.stage-2 .lvl-1, .leaf-pile.stage-2 .lvl-2 { display: block; }
    .leaf-pile.stage-3 .lvl-1, .leaf-pile.stage-3 .lvl-2, .leaf-pile.stage-3 .lvl-3 { display: block; }
    .leaf-pile.stage-4 .lvl-1, .leaf-pile.stage-4 .lvl-2, .leaf-pile.stage-4 .lvl-3, .leaf-pile.stage-4 .lvl-4 { display: block; }
    .leaf-pile.stage-5 .lvl { display: block; }

    .ground-pickup-leaf {
      position: absolute;
      bottom: 28px;
      left: 28%;
      width: 32px;
      height: 32px;
      z-index: 7;
      display: none;
    }
    .ground-pickup-leaf.active {
      display: block;
      animation: dropLeaf 0.45s steps(4) forwards;
    }
    @keyframes dropLeaf {
      0% { transform: translateY(-60px) rotate(-90deg) scale(0.5); opacity: 0; }
      100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    }

    .held-leaf {
      position: absolute;
      top: -24px;
      left: 16px;
      width: 32px;
      height: 32px;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
    }
    .ground-mascot.has-leaf .held-leaf {
      opacity: 1;
      animation: leafWiggle 0.3s steps(2) infinite;
    }
    @keyframes leafWiggle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px) rotate(6deg); }
    }

    .ground-mascot.gathering {
      animation: gatherRun 3.4s steps(80) forwards !important;
    }
    @keyframes gatherRun {
      0% { left: 10%; transform: scaleX(1); }
      25% { left: 26%; transform: scaleX(1); }
      35% { left: 26%; transform: scaleX(1) translateY(4px); }
      40% { left: 26%; transform: scaleX(1) translateY(0); }
      45% { left: 30%; transform: scaleX(1); }
      75% { left: calc(100vw - 18% - 130px); transform: scaleX(1); }
      82% { left: calc(100vw - 18% - 130px); transform: scaleX(1) translateY(-22px); }
      90% { left: calc(100vw - 18% - 130px); transform: scaleX(1) translateY(0); }
      100% { left: calc(100vw - 18% - 130px); transform: scaleX(-1); }
    }

    .leaf-popup-text {
      position: absolute;
      bottom: 105px;
      right: 19%;
      color: #ffd043;
      font-size: 12px;
      text-shadow: 2px 2px 0px #000;
      z-index: 20;
      pointer-events: none;
      animation: floatBadge 1.4s ease-out forwards;
    }
    @keyframes floatBadge {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }

    /* Autumn Dirt Ground & Trees */
    .pixel-ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: var(--ground-top);
      border-top: 6px solid #63331a;
      box-shadow: inset 0 -16px 0 0 var(--ground-dark);
      z-index: 6;
    }
    .pixel-grass-clumps {
      position: absolute;
      top: -12px;
      left: 0;
      width: 100%;
      height: 6px;
      background-image: 
        radial-gradient(#d37424 50%, transparent 50%),
        radial-gradient(#7c3614 50%, transparent 50%);
      background-size: 24px 12px;
    }
    .tree { position: absolute; bottom: 40px; transform-origin: bottom center; }
    .tree-left { left: -20px; width: 240px; height: 380px; animation: windSwayLeft 5.5s ease-in-out infinite; z-index: 7; }
    .tree-right { right: -30px; width: 260px; height: 410px; animation: windSwayRight 6.5s ease-in-out infinite; z-index: 7; }
    .tree-back-left { left: 18%; bottom: 44px; width: 150px; height: 250px; opacity: 0.65; z-index: 3; }
    .tree-back-right { right: 17%; bottom: 44px; width: 170px; height: 270px; opacity: 0.65; z-index: 3; }
    .jeppy-owl { position: absolute; top: 150px; right: 55px; width: 24px; height: 24px; z-index: 8; }
    .jeppy-eyes { animation: blink 4s infinite; }
    @keyframes blink { 0%, 94%, 98%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes windSwayLeft { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    @keyframes windSwayRight { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }

    /* Falling Autumn Leaves */
    .leaf {
      position: fixed;
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 9;
      animation: fallAndDrift linear infinite;
    }
    @keyframes fallAndDrift {
      0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translate(140px, 105vh) rotate(360deg); opacity: 0; }
    }
    .leaf-1 { left: 5%; animation-duration: 9s; }
    .leaf-2 { left: 25%; animation-duration: 7s; animation-delay: 2s; }
    .leaf-3 { left: 55%; animation-duration: 10s; animation-delay: 1s; }
    .leaf-4 { left: 80%; animation-duration: 8s; animation-delay: 3s; }

    /* ==========================================================
       JAPANESE ZEN GARDEN LAYER (BREAK MODE)
       ========================================================== */
    .zen-garden-layer {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* 1. Raked White Sand Ground */
    .zen-ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: var(--zen-sand);
      border-top: 6px solid #b3a992;
      box-shadow: inset 0 -18px 0 0 var(--zen-sand-shade);
      z-index: 6;
    }

    .zen-ripples {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 7px,
        rgba(150, 137, 114, 0.45) 7px,
        rgba(150, 137, 114, 0.45) 9px
      );
    }

    /* 2. Majestic Mt. Fuji (Background Right) */
    .zen-fuji {
      position: absolute;
      bottom: 60px;
      right: 2%;
      width: 480px;
      height: 330px;
      z-index: 6;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
    }

    /* 3. Grand Thatched Tea Pavilion (Left - Planted on Ground) */
    .zen-pavilion {
      position: absolute;
      bottom: 58px; /* Firmly touches the sand ground */
      left: 1.5%;
      width: 320px;
      height: 340px;
      z-index: 7;
      filter: drop-shadow(4px 4px 0px rgba(0, 0, 0, 0.35));
    }

    /* 4. Zen Master Jeppy on the Deck */
    .zen-jeppy {
      position: absolute;
      bottom: 84px; /* Perfectly aligned to the porch floor */
      left: 135px;
      width: 58px;
      height: 58px;
      z-index: 8;
      animation: teaSip 3.5s steps(2) infinite;
    }

    @keyframes teaSip {
      0%, 80%, 100% { transform: translateY(0); }
      85%, 95% { transform: translateY(-3px); }
    }

    .tea-steam {
      animation: steamFloat 1.8s infinite;
      transform-origin: center;
    }
    @keyframes steamFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      50% { opacity: 1; transform: translateY(-6px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-14px) scale(0.7); }
    }

    /* 5. Grandiose Vermilion Red Bridge (Center-Left) */
    .zen-bridge {
      position: absolute;
      bottom: 58px; /* Sits directly on the ground */
      left: 27%;
      width: 420px;
      height: 185px;
      z-index: 7;
      filter: drop-shadow(0 8px 0px rgba(0, 0, 0, 0.35));
    }

    /* Drifting Pink Sakura Blossom Petals */
    .sakura-petal {
      display: none;
      position: fixed;
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 10;
      animation: sakuraDrift linear infinite;
    }
    @keyframes sakuraDrift {
      0% {
        transform: translate(0, -20px) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 1; }
      50% { transform: translate(90px, 45vh) rotate(180deg); }
      90% { opacity: 1; }
      100% {
        transform: translate(160px, 105vh) rotate(360deg);
        opacity: 0;
      }
    }
    .sakura-1 { left: 10%; animation-duration: 8s; }
    .sakura-2 { left: 32%; animation-duration: 6.5s; animation-delay: 1.5s; }
    .sakura-3 { left: 60%; animation-duration: 9.5s; animation-delay: 0.5s; }
    .sakura-4 { left: 82%; animation-duration: 7s; animation-delay: 2.5s; }

    /* Responsive */
    @media (max-width: 1200px) {
      .zen-pavilion { width: 250px; height: 270px; left: -10px; }
      .zen-jeppy { left: 95px; bottom: 78px; width: 48px; height: 48px; }
      .zen-bridge { width: 330px; height: 145px; left: 24%; }
      .zen-fuji { width: 360px; height: 250px; right: -20px; }
    }
  </style>
</head>
<body>

  <!-- ==========================================================
       FALLING AUTUMN LEAVES (STUDY MODE)
       ========================================================== -->
  <svg class="leaf autumn-leaf leaf-1" viewBox="0 0 4 4" shape-rendering="crispEdges">
    <rect x="1" y="0" width="2" height="1" fill="#f4b41b" />
    <rect x="0" y="1" width="4" height="2" fill="#e66b27" />
    <rect x="1" y="3" width="2" height="1" fill="#a3281b" />
  </svg>
  <svg class="leaf autumn-leaf leaf-2" viewBox="0 0 4 4" shape-rendering="crispEdges">
    <rect x="1" y="0" width="2" height="1" fill="#a3281b" />
    <rect x="0" y="1" width="4" height="2" fill="#c4431e" />
    <rect x="1" y="3" width="2" height="1" fill="#801c13" />
  </svg>
  <svg class="leaf autumn-leaf leaf-3" viewBox="0 0 4 4" shape-rendering="crispEdges">
    <rect x="1" y="0" width="2" height="1" fill="#ffd043" />
    <rect x="0" y="1" width="4" height="2" fill="#f4b41b" />
    <rect x="1" y="3" width="2" height="1" fill="#bd7613" />
  </svg>
  <svg class="leaf autumn-leaf leaf-4" viewBox="0 0 4 4" shape-rendering="crispEdges">
    <rect x="1" y="0" width="2" height="1" fill="#e66b27" />
    <rect x="0" y="1" width="4" height="2" fill="#d0501a" />
    <rect x="1" y="3" width="2" height="1" fill="#872910" />
  </svg>

  <!-- ==========================================================
       DRIFTING PINK SAKURA PETALS (ZEN BREAK MODE)
       ========================================================== -->
  <svg class="sakura-petal sakura-1" viewBox="0 0 6 6" shape-rendering="crispEdges">
    <rect x="2" y="0" width="2" height="1" fill="#ff7597" />
    <rect x="1" y="1" width="4" height="3" fill="#ffaec9" />
    <rect x="2" y="4" width="2" height="1" fill="#ff7597" />
    <rect x="2" y="2" width="2" height="1" fill="#ffffff" />
  </svg>
  <svg class="sakura-petal sakura-2" viewBox="0 0 6 6" shape-rendering="crispEdges">
    <rect x="1" y="1" width="4" height="4" fill="#ff4b93" />
    <rect x="2" y="2" width="2" height="2" fill="#ffaec9" />
  </svg>
  <svg class="sakura-petal sakura-3" viewBox="0 0 6 6" shape-rendering="crispEdges">
    <rect x="2" y="0" width="2" height="1" fill="#ff7597" />
    <rect x="0" y="1" width="6" height="3" fill="#ffaec9" />
    <rect x="1" y="4" width="4" height="1" fill="#d6226b" />
  </svg>
  <svg class="sakura-petal sakura-4" viewBox="0 0 6 6" shape-rendering="crispEdges">
    <rect x="2" y="1" width="2" height="4" fill="#ffaec9" />
    <rect x="1" y="2" width="4" height="2" fill="#ff7597" />
  </svg>

  <!-- ==========================================================
       FOREGROUND INTERFACE (HUD)
       ========================================================== -->
  <div class="content-wrapper">
    <div class="title-badge">
      <h1 class="main-title" id="pageTitle">Jepi's Always Watching....</h1>
    </div>

    <!-- Search Form -->
    <form action="https://www.google.com/search">
      <div class="search-container">
        <input
          type="text"
          name="q"
          placeholder="> Search Google..."
          autocomplete="off"
        >
      </div>
    </form>

    <!-- Retro Focus HUD -->
    <div class="timer-container">
      <h2 id="hudStatus">Focus Timer</h2>
      <h1 id="timer">25:00</h1>
      <p id="leaves">
        <svg width="14" height="14" viewBox="0 0 8 8" shape-rendering="crispEdges">
          <rect x="3" y="0" width="2" height="1" fill="#f4b41b" />
          <rect x="2" y="1" width="4" height="2" fill="#e66b27" />
          <rect x="1" y="3" width="6" height="3" fill="#cf4a17" />
          <rect x="2" y="6" width="4" height="1" fill="#9c2712" />
          <rect x="3" y="7" width="2" height="1" fill="#5c1507" />
        </svg>
        Leaves collected: 0
      </p>
      <br>
      <button id="endBreakBtn">Lock Back In</button>
    </div>
  </div>

  <!-- ==========================================================
       AUTUMN HAVEN LAYER (ACTIVE DURING FOCUS SESSION)
       ========================================================== -->
  <div class="forest-layer">
    <!-- Background Trees -->
